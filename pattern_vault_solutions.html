<title>Pattern Vault — Solutions</title>
<style>
  :root{

    --medium:#e6c15e;

      --bg-elev2:#eef2ef;

      --line-soft:#e5eae7;

      --accent:#1f9d63;
      --accent-dim:#bfe8d4;
      --accent-ink:#ffffff;
      --easy:#1f9d63;
      --medium:#a8790a;
      --hard:#c0432c;
      --code-bg:#0e1210;

  }
  :root[data-theme="light"]{
    --bg:#f7f9f7;
    --bg-elev:#ffffff;
    --bg-elev2:#eef2ef;
    --line:#d9e0dc;
    --line-soft:#e5eae7;
    --ink:#16201b;
    --ink-dim:#4c5f55;
    --ink-faint:#7c8f85;
    --accent:#1f9d63;
    --accent-dim:#bfe8d4;
    --accent-ink:#ffffff;
    --easy:#1f9d63;
    --medium:#a8790a;
    --hard:#c0432c;
    --code-bg:#0e1210;
  }
  :root[data-theme="dark"]{
    --bg:#0e1210;
    --bg-elev:#141b18;
    --bg-elev2:#1a2320;
    --line:#26332e;
    --line-soft:#1e2823;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);}

  /* ===== Topbar ===== */
  .topbar{
    border-bottom:1px solid var(--line);
    padding:16px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:30;
  }
  .brand{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .brand .mark{
    font-family:var(--serif);
    font-size:20px;
    color:var(--ink);
    white-space:nowrap;
  }
  .brand .mark span{color:var(--accent); font-style:italic;}
  .brand .tag{color:var(--ink-faint); font-size:11px;}

  .topbar-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .stat{text-align:right; line-height:1.2;}
  .stat .n{font-size:16px; color:var(--accent); font-variant-numeric:tabular-nums;}
  .stat .l{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em;}

  .theme-toggle{
    border:1px solid var(--line);
    background:var(--bg-elev);
    color:var(--ink);
    border-radius:var(--radius);
    padding:6px 10px;
    cursor:pointer;
    font-family:var(--mono);
    font-size:12px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .theme-toggle:hover{border-color:var(--accent);}

  /* ===== Layout ===== */
  .layout{
    display:grid;
    grid-template-columns:260px 1fr;
    min-height:calc(100vh - 60px);
  }
  @media(max-width:900px){
    .layout{grid-template-columns:1fr;}
    .sidebar{
      position:static;
      max-height:none;
      border-right:none;
      border-bottom:1px solid var(--line);
    }
  }

  .sidebar{
    border-right:1px solid var(--line);
    padding:16px;
    position:sticky;
    top:61px;
    align-self:start;
    max-height:calc(100vh - 61px);
    overflow-y:auto;
  }
  .search-box{
    width:100%;
    background:var(--bg-elev);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:var(--radius);
    padding:8px 10px;
    font-family:var(--mono);
    font-size:13px;
    margin-bottom:6px;
  }
  .search-box:focus{outline:none; border-color:var(--accent);}

  .filter-row{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .filter-chip{
    border:1px solid var(--line);
    background:var(--bg-elev);
    color:var(--ink-dim);
    border-radius:999px;
    padding:3px 10px;
    font-size:11px;
    cursor:pointer;
    user-select:none;
  }
  .filter-chip.active{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}

  .nav-topic{margin-bottom:4px;}
  .nav-topic-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 8px;
    cursor:pointer;
    border-radius:var(--radius);
    font-size:12.5px;
    color:var(--ink);

  .nav-topic-head:hover{background:var(--bg-elev2);}
  .nav-topic-head .cnt{color:var(--ink-faint); font-size:11px;}
  .nav-sub{
    padding:5px 8px 5px 18px;
    font-size:12px;
    color:var(--ink-dim);
    cursor:pointer;
    border-radius:var(--radius);
    display:flex;
    justify-content:space-between;
  }
  .nav-sub:hover{background:var(--bg-elev2); color:var(--ink);}
  .nav-sub.active-sub{color:var(--accent);}
  .nav-subs{display:none;}
  .nav-subs.open{display:block;}

  .main{padding:20px 26px 60px; max-width:900px;}
  .topic-header{margin-bottom:18px;}
  .topic-header h1{
    font-family:var(--serif);
    font-size:26px;
    margin:0 0 4px;
    color:var(--ink);
  }
  .topic-header .desc{color:var(--ink-dim); font-size:13px;}

    font-size:16px;
    color:var(--ink);
    border-bottom:1px solid var(--line);

    margin:0 0 4px;
    display:flex;

  .problem-card{

    border:1px solid var(--line);

    margin-bottom:12px;

    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    cursor:pointer;

  .problem-head:hover{background:var(--bg-elev2);}
  .chk{
    width:16px; height:16px;
    border:1px solid var(--ink-faint);
    border-radius:3px;
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    background:transparent;
  }
  .chk.done{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-size:11px;}
  .p-title{flex:1; font-size:13.5px; color:var(--ink);}
  .p-title.done-text{color:var(--ink-faint); text-decoration:line-through;}
  .diff-badge{
    font-size:10.5px;
    padding:2px 8px;
    border-radius:999px;
    font-weight:600;
    letter-spacing:0.02em;
    flex:0 0 auto;

  .diff-Easy{color:var(--easy); border:1px solid var(--easy);}
  .diff-Medium{color:var(--medium); border:1px solid var(--medium);}
  .diff-Hard{color:var(--hard); border:1px solid var(--hard);}
  .chevron{color:var(--ink-faint); font-size:11px; transition:transform 0.15s; flex:0 0 auto;}
  .problem-card.open .chevron{transform:rotate(90deg);}

  .problem-body{
    display:none;
    padding:2px 16px 18px;
    border-top:1px solid var(--line-soft);
  }
  .problem-card.open .problem-body{display:block;}
  .problem-body h4{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-faint);
    margin:14px 0 6px;
  }
  .problem-body p{margin:0; color:var(--ink-dim); font-size:13px; line-height:1.6;}
  .code-wrap{position:relative;}
  .code-wrap pre{
    background:var(--code-bg);
    color:#d7e6dd;
    padding:12px 14px;
    border-radius:var(--radius);
    overflow-x:auto;
    font-size:12.5px;
    line-height:1.55;
    margin:0;
  }
  .copy-btn{
    position:absolute;
    top:8px; right:8px;
    background:var(--bg-elev2);
    color:var(--ink-dim);
    border:1px solid var(--line);
    border-radius:3px;
    font-size:10.5px;
    padding:3px 8px;
    cursor:pointer;
    font-family:var(--mono);
  }
  .copy-btn:hover{color:var(--accent); border-color:var(--accent);}

  .empty-state{color:var(--ink-faint); padding:40px 0; text-align:center; font-size:13px;}

  code.inline{
    background:var(--bg-elev2);
    padding:1px 5px;
    border-radius:3px;
    font-size:12px;
  }

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

<script>
window.__DATA__ = [
{topic:"Array", desc:"Fundamental collection of elements stored at contiguous memory locations.", subs:[
  {name:"Two-Pointer", hint:"Move two indices toward or away from each other to cut redundant comparisons.", problems:[
    {title:"Two Sum II - Input Array Is Sorted", diff:"Easy",
     statement:`Given a 1-indexed array \`numbers\` sorted in non-decreasing order, find two numbers that add up to \`target\` and return their 1-indexed positions.`,
     approach:`Since the array is sorted, use two pointers, \`lo\` at the start and \`hi\` at the end. If the sum is too small, move \`lo\` right; if too large, move \`hi\` left. Each comparison eliminates one candidate pair permanently.`,
     code:`def twoSum(numbers: list[int], target: int) -> list[int]:
    lo, hi = 0, len(numbers) - 1
    while lo < hi:
        s = numbers[lo] + numbers[hi]
        if s == target:
            return [lo + 1, hi + 1]
        elif s < target:
            lo += 1
        else:
            hi -= 1
    return []`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Container With Most Water", diff:"Medium",
     statement:`Given heights of vertical lines at each index, find two lines that together with the x-axis form a container holding the most water.`,
     approach:`Start with the widest container. The area is limited by the shorter line. Moving the taller pointer inward can only shrink width without a chance of increasing the limiting height, so always move the *shorter* pointer inward.`,
     code:`def maxArea(height: list[int]) -> int:
    lo, hi = 0, len(height) - 1
    best = 0
    while lo < hi:
        h = min(height[lo], height[hi])
        best = max(best, h * (hi - lo))
        if height[lo] < height[hi]:
            lo += 1
        else:
            hi -= 1
    return best`,
     complexity:`Time O(n), Space O(1).`},
    {title:"3Sum", diff:"Medium",
     statement:`Find all unique triplets in an array that sum to zero.`,
     approach:`Sort the array. Fix the smallest element \`nums[i]\` and use two-pointer on the remaining sorted subarray to find pairs summing to \`-nums[i]\`. Skip duplicate values to avoid duplicate triplets.`,
     code:`def threeSum(nums: list[int]) -> list[list[int]]:
    nums.sort()
    n = len(nums)
    res = []
    for i in range(n - 2):
        if i > 0 and nums[i] == nums[i - 1]:
            continue
        if nums[i] > 0:
            break
        lo, hi = i + 1, n - 1
        while lo < hi:
            s = nums[i] + nums[lo] + nums[hi]
            if s < 0:
                lo += 1
            elif s > 0:
                hi -= 1
            else:
                res.append([nums[i], nums[lo], nums[hi]])
                lo += 1
                hi -= 1
                while lo < hi and nums[lo] == nums[lo - 1]:
                    lo += 1
                while lo < hi and nums[hi] == nums[hi + 1]:
                    hi -= 1
    return res`,
     complexity:`Time O(n^2), Space O(1) extra.`},
    {title:"Sort Colors", diff:"Medium",
     statement:`Given an array with values 0, 1, 2, sort it in-place in one pass (Dutch National Flag).`,
     approach:`Maintain three pointers: \`low\` (next 0 boundary), \`mid\` (current), \`high\` (next 2 boundary). Swap toward the correct boundary and advance pointers accordingly.`,
     code:`def sortColors(nums: list[int]) -> None:
    low, mid, high = 0, 0, len(nums) - 1
    while mid <= high:
        if nums[mid] == 0:
            nums[low], nums[mid] = nums[mid], nums[low]
            low += 1
            mid += 1
        elif nums[mid] == 1:
            mid += 1
        else:
            nums[mid], nums[high] = nums[high], nums[mid]
            high -= 1`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Trapping Rain Water", diff:"Hard",
     statement:`Given non-negative heights forming an elevation map, compute how much water it can trap after raining.`,
     approach:`Use two pointers tracking running leftMax/rightMax. The side with the smaller running max has its water level fully determined (the far side is at least as tall), so resolve that side and advance it.`,
     code:`def trap(height: list[int]) -> int:
    lo, hi = 0, len(height) - 1
    left_max, right_max = 0, 0
    water = 0
    while lo < hi:
        if height[lo] < height[hi]:
            left_max = max(left_max, height[lo])
            water += left_max - height[lo]
            lo += 1
        else:
            right_max = max(right_max, height[hi])
            water += right_max - height[hi]
            hi -= 1
    return water`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Remove Duplicates from Sorted Array", diff:"Easy",
     statement:`Remove duplicates in-place from a sorted array so each unique element appears once; return the new length.`,
     approach:`Slow pointer \`k\` marks the end of the unique prefix; fast pointer scans forward. Write new distinct values right after the unique prefix.`,
     code:`def removeDuplicates(nums: list[int]) -> int:
    if not nums:
        return 0
    k = 1
    for i in range(1, len(nums)):
        if nums[i] != nums[k - 1]:
            nums[k] = nums[i]
            k += 1
    return k`,
     complexity:`Time O(n), Space O(1).`}
  ]},
  {name:"Sliding Window", hint:"Maintain a fixed or elastic window to satisfy a running condition.", problems:[
    {title:"Maximum Average Subarray I", diff:"Easy",
     statement:`Find the contiguous subarray of length k with the maximum average.`,
     approach:`Maintain a fixed-size window sum; slide by adding the new element and subtracting the one leaving. Track the max sum (dividing by k is monotonic).`,
     code:`def findMaxAverage(nums: list[int], k: int) -> float:
    window_sum = sum(nums[:k])
    best = window_sum
    for i in range(k, len(nums)):
        window_sum += nums[i] - nums[i - k]
        best = max(best, window_sum)
    return best / k`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Longest Substring Without Repeating Characters", diff:"Medium",
     statement:`Find the length of the longest substring without repeating characters.`,
     approach:`Variable window [left, right] with a hashmap of last-seen index per char. When a repeat is seen inside the window, jump left past its previous occurrence.`,
     code:`def lengthOfLongestSubstring(s: str) -> int:
    last_seen = {}
    left = 0
    best = 0
    for right, ch in enumerate(s):
        if ch in last_seen and last_seen[ch] >= left:
            left = last_seen[ch] + 1
        last_seen[ch] = right
        best = max(best, right - left + 1)
    return best`,
     complexity:`Time O(n), Space O(min(n, alphabet)).`},
    {title:"Minimum Size Subarray Sum", diff:"Medium",
     statement:`Find the minimal length of a contiguous subarray whose sum is >= target.`,
     approach:`Expand right, accumulating sum. Whenever sum meets target, shrink from left as much as possible while still meeting it, recording the smallest window.`,
     code:`def minSubArrayLen(target: int, nums: list[int]) -> int:
    left = 0
    total = 0
    best = float('inf')
    for right, val in enumerate(nums):
        total += val
        while total >= target:
            best = min(best, right - left + 1)
            total -= nums[left]
            left += 1
    return 0 if best == float('inf') else best`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Longest Repeating Character Replacement", diff:"Medium",
     statement:`Given a string and integer k, you may replace up to k characters; find the longest substring of a single repeating character after replacements.`,
     approach:`Keep frequency counts inside the window plus maxFreq. Window valid while windowLength - maxFreq <= k. Shrink from left when invalid.`,
     code:`def characterReplacement(s: str, k: int) -> int:
    from collections import defaultdict
    count = defaultdict(int)
    left = 0
    max_freq = 0
    best = 0
    for right, ch in enumerate(s):
        count[ch] += 1
        max_freq = max(max_freq, count[ch])
        while (right - left + 1) - max_freq > k:
            count[s[left]] -= 1
            left += 1
        best = max(best, right - left + 1)
    return best`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Permutation in String", diff:"Medium",
     statement:`Given s1 and s2, determine if s2 contains a permutation of s1 as a contiguous substring.`,
     approach:`Slide a fixed window of length len(s1) across s2, comparing 26-letter frequency arrays for equality.`,
     code:`def checkInclusion(s1: str, s2: str) -> bool:
    n1, n2 = len(s1), len(s2)
    if n1 > n2:
        return False
    need = [0] * 26
    window = [0] * 26
    for ch in s1:
        need[ord(ch) - 97] += 1
    for i in range(n2):
        window[ord(s2[i]) - 97] += 1
        if i >= n1:
            window[ord(s2[i - n1]) - 97] -= 1
        if window == need:
            return True
    return False`,
     complexity:`Time O(26*n2), Space O(1).`},
    {title:"Sliding Window Maximum", diff:"Hard",
     statement:`Given an array and window size k, return the maximum of each sliding window.`,
     approach:`Monotonic decreasing deque of indices; front always holds current window's max index. Pop smaller trailing values, push new index, pop expired front index.`,
     code:`from collections import deque

def maxSlidingWindow(nums: list[int], k: int) -> list[int]:
    dq = deque()
    result = []
    for i, val in enumerate(nums):
        while dq and nums[dq[-1]] <= val:
            dq.pop()
        dq.append(i)
        if dq[0] <= i - k:
            dq.popleft()
        if i >= k - 1:
            result.append(nums[dq[0]])
    return result`,
     complexity:`Time O(n) amortized, Space O(k).`},
    {title:"Fruit Into Baskets", diff:"Medium",
     statement:`Given an array of fruit types, find the longest subarray containing at most 2 distinct types.`,
     approach:`Longest substring with at most 2 distinct elements. Keep a frequency map; shrink from left whenever distinct count exceeds 2.`,
     code:`def totalFruit(fruits: list[int]) -> int:
    from collections import defaultdict
    count = defaultdict(int)
    left = 0
    best = 0
    for right, fruit in enumerate(fruits):
        count[fruit] += 1
        while len(count) > 2:
            count[fruits[left]] -= 1
            if count[fruits[left]] == 0:
                del count[fruits[left]]
            left += 1
        best = max(best, right - left + 1)
    return best`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Minimum Window Substring", diff:"Hard",
     statement:`Given s and t, find the smallest substring of s that contains all characters of t (with multiplicity).`,
     approach:`Track need (freq map of t) and window (running counts in s). formed counts how many distinct chars currently meet their requirement. Expand right until formed == required, then shrink left while valid, updating the best window.`,
     code:`def minWindow(s: str, t: str) -> str:
    from collections import Counter
    if not s or not t:
        return ""
    need = Counter(t)
    window = {}
    required = len(need)
    formed = 0
    left = 0
    best_len, best_l, best_r = float('inf'), 0, 0

    for right, ch in enumerate(s):
        window[ch] = window.get(ch, 0) + 1
        if ch in need and window[ch] == need[ch]:
            formed += 1

        while formed == required:
            if right - left + 1 < best_len:
                best_len = right - left + 1
                best_l, best_r = left, right
            left_ch = s[left]
            window[left_ch] -= 1
            if left_ch in need and window[left_ch] < need[left_ch]:
                formed -= 1
            left += 1

    return "" if best_len == float('inf') else s[best_l:best_r + 1]`,
     complexity:`Time O(|s| + |t|), Space O(|s| + |t|).`}
  ]},
  {name:"Prefix Sum", hint:"Precompute cumulative sums so any range sum answers in O(1).", problems:[
    {title:"Range Sum Query - Immutable", diff:"Easy",
     statement:`Answer multiple queries for the sum of elements between indices i and j (inclusive) efficiently.`,
     approach:`Precompute prefix sums, prefix[0]=0. sumRange(i,j) = prefix[j+1] - prefix[i].`,
     code:`class NumArray:
    def __init__(self, nums: list[int]):
        self.prefix = [0] * (len(nums) + 1)
        for i, v in enumerate(nums):
            self.prefix[i + 1] = self.prefix[i] + v

    def sumRange(self, i: int, j: int) -> int:
        return self.prefix[j + 1] - self.prefix[i]`,
     complexity:`Build O(n); each query O(1).`},
    {title:"Find Pivot Index", diff:"Easy",
     statement:`Find the leftmost index where the sum to its left equals the sum to its right.`,
     approach:`Compute total sum. Walk left to right tracking left_sum; right sum is total - left_sum - nums[i].`,
     code:`def pivotIndex(nums: list[int]) -> int:
    total = sum(nums)
    left_sum = 0
    for i, v in enumerate(nums):
        if left_sum == total - left_sum - v:
            return i
        left_sum += v
    return -1`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Subarray Sum Equals K", diff:"Medium",
     statement:`Count the number of contiguous subarrays whose sum equals k.`,
     approach:`If prefix[j]-prefix[i]==k, subarray (i,j] sums to k. Maintain a running prefix sum and hashmap counting prefix-sum occurrences; add count[running-k] at each step.`,
     code:`def subarraySum(nums: list[int], k: int) -> int:
    from collections import defaultdict
    count = defaultdict(int)
    count[0] = 1
    running = 0
    result = 0
    for v in nums:
        running += v
        result += count[running - k]
        count[running] += 1
    return result`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Product of Array Except Self", diff:"Medium",
     statement:`Return an array where each element is the product of all others, without division, O(n) time.`,
     approach:`Build prefix products left-to-right into result, then multiply in suffix products right-to-left with a running variable.`,
     code:`def productExceptSelf(nums: list[int]) -> list[int]:
    n = len(nums)
    res = [1] * n
    prefix = 1
    for i in range(n):
        res[i] = prefix
        prefix *= nums[i]
    suffix = 1
    for i in range(n - 1, -1, -1):
        res[i] *= suffix
        suffix *= nums[i]
    return res`,
     complexity:`Time O(n), Space O(1) extra.`},
    {title:"Continuous Subarray Sum", diff:"Medium",
     statement:`Given an array and integer k, determine if it has a contiguous subarray of size >= 2 whose sum is a multiple of k.`,
     approach:`Equal prefix-sum remainders (mod k) mark a subarray summing to a multiple of k. Track earliest index per remainder (seed remainder 0 at index -1).`,
     code:`def checkSubarraySum(nums: list[int], k: int) -> bool:
    seen = {0: -1}
    running = 0
    for i, v in enumerate(nums):
        running += v
        if k != 0:
            running %= k
        if running in seen:
            if i - seen[running] >= 2:
                return True
        else:
            seen[running] = i
    return False`,
     complexity:`Time O(n), Space O(min(n, k)).`},
    {title:"Contiguous Array", diff:"Medium",
     statement:`Find the maximum length of a contiguous subarray with an equal number of 0s and 1s.`,
     approach:`Treat 0 as -1, 1 as +1. Equal counts means running sum 0 between two indices. Store first index per running sum (seed 0 at -1); a repeat gives a candidate length.`,
     code:`def findMaxLength(nums: list[int]) -> int:
    first_index = {0: -1}
    running = 0
    best = 0
    for i, v in enumerate(nums):
        running += 1 if v == 1 else -1
        if running in first_index:
            best = max(best, i - first_index[running])
        else:
            first_index[running] = i
    return best`,
     complexity:`Time O(n), Space O(n).`}
  ]},
  {name:"Kadane's Algorithm", hint:"Track the best subarray sum ending at each index and update the global max.", problems:[
    {title:"Maximum Subarray", diff:"Medium",
     statement:`Find the contiguous subarray with the largest sum.`,
     approach:`Kadane's: cur is the best sum ending at the current index (extend or restart). Track a running global best.`,
     code:`def maxSubArray(nums: list[int]) -> int:
    cur = best = nums[0]
    for v in nums[1:]:
        cur = max(v, cur + v)
        best = max(best, cur)
    return best`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Maximum Product Subarray", diff:"Medium",
     statement:`Find the contiguous subarray with the largest product.`,
     approach:`Track both running max and running min product ending at each index, since a negative flips the sign and a very negative min can become the largest via another negative.`,
     code:`def maxProduct(nums: list[int]) -> int:
    cur_max = cur_min = best = nums[0]
    for v in nums[1:]:
        candidates = (v, cur_max * v, cur_min * v)
        cur_max, cur_min = max(candidates), min(candidates)
        best = max(best, cur_max)
    return best`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Best Time to Buy and Sell Stock", diff:"Easy",
     statement:`Given daily stock prices, find max profit from one buy and one later sell.`,
     approach:`Track min price seen so far; at each day the best sell profit is price - min_so_far. Keep the running max.`,
     code:`def maxProfit(prices: list[int]) -> int:
    min_price = float('inf')
    best = 0
    for p in prices:
        min_price = min(min_price, p)
        best = max(best, p - min_price)
    return best`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Max Absolute Sum of Any Subarray", diff:"Medium",
     statement:`Find the maximum absolute value of the sum of any contiguous subarray.`,
     approach:`Run Kadane twice: once for max subarray sum, once for min subarray sum (mirrored). Answer is max(abs(maxSum), abs(minSum)).`,
     code:`def maxAbsoluteSum(nums: list[int]) -> int:
    max_end = min_end = 0
    best_max = best_min = 0
    for v in nums:
        max_end = max(0, max_end) + v
        min_end = min(0, min_end) + v
        best_max = max(best_max, max_end)
        best_min = min(best_min, min_end)
    return max(best_max, -best_min)`,
     complexity:`Time O(n), Space O(1).`},
    {title:"House Robber", diff:"Medium",
     statement:`Given non-negative amounts in houses in a line, find max sum obtainable without robbing two adjacent houses.`,
     approach:`Two running variables: take (best if current house robbed), skip (best if not). take = skip_prev + nums[i]; skip = max(take_prev, skip_prev).`,
     code:`def rob(nums: list[int]) -> int:
    take, skip = 0, 0
    for v in nums:
        take, skip = skip + v, max(take, skip)
    return max(take, skip)`,
     complexity:`Time O(n), Space O(1).`}
  ]}
]},
{topic:"Strings", desc:"Sequence of characters and common string manipulation patterns.", subs:[
  {name:"Two-Pointer (Palindrome)", hint:"Compare from both ends and move inward until the condition fails.", problems:[
    {title:"Valid Palindrome", diff:"Easy",
     statement:`Given a string, determine if it is a palindrome after converting uppercase to lowercase and removing non-alphanumeric characters.`,
     approach:`Two pointers from both ends, skipping non-alphanumeric characters, comparing lowercase versions.`,
     code:`def isPalindrome(s: str) -> bool:
    lo, hi = 0, len(s) - 1
    while lo < hi:
        while lo < hi and not s[lo].isalnum():
            lo += 1
        while lo < hi and not s[hi].isalnum():
            hi -= 1
        if s[lo].lower() != s[hi].lower():
            return False
        lo += 1
        hi -= 1
    return True`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Valid Palindrome II", diff:"Easy",
     statement:`Determine if a string can become a palindrome after deleting at most one character.`,
     approach:`Two pointers moving inward; on the first mismatch, check if skipping either the left or right character yields a palindrome for the rest.`,
     code:`def validPalindrome(s: str) -> bool:
    def is_pal(lo, hi):
        while lo < hi:
            if s[lo] != s[hi]:
                return False
            lo += 1
            hi -= 1
        return True

    lo, hi = 0, len(s) - 1
    while lo < hi:
        if s[lo] != s[hi]:
            return is_pal(lo + 1, hi) or is_pal(lo, hi - 1)
        lo += 1
        hi -= 1
    return True`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Longest Palindromic Substring", diff:"Medium",
     statement:`Find the longest palindromic substring within a string.`,
     approach:`Expand around every center (once for odd length, once for even length), tracking the longest expansion.`,
     code:`def longestPalindrome(s: str) -> str:
    if not s:
        return ""

    def expand(lo, hi):
        while lo >= 0 and hi < len(s) and s[lo] == s[hi]:
            lo -= 1
            hi += 1
        return lo + 1, hi - 1

    start, end = 0, 0
    for i in range(len(s)):
        l1, r1 = expand(i, i)
        if r1 - l1 > end - start:
            start, end = l1, r1
        l2, r2 = expand(i, i + 1)
        if r2 - l2 > end - start:
            start, end = l2, r2
    return s[start:end + 1]`,
     complexity:`Time O(n^2), Space O(1).`},
    {title:"Palindromic Substrings", diff:"Medium",
     statement:`Count how many palindromic substrings exist in a string (different positions counted separately).`,
     approach:`Same expand-around-center technique, counting every successful expansion for odd and even centers.`,
     code:`def countSubstrings(s: str) -> int:
    count = 0

    def expand(lo, hi):
        nonlocal count
        while lo >= 0 and hi < len(s) and s[lo] == s[hi]:
            count += 1
            lo -= 1
            hi += 1

    for i in range(len(s)):
        expand(i, i)
        expand(i, i + 1)
    return count`,
     complexity:`Time O(n^2), Space O(1).`},
    {title:"Reverse Words in a String", diff:"Medium",
     statement:`Given a string with words separated by possibly multiple spaces, reverse the order of words, collapsing extra whitespace.`,
     approach:`Python's split() with no args splits on whitespace runs and discards empties; reverse the list and join with a single space.`,
     code:`def reverseWords(s: str) -> str:
    return " ".join(reversed(s.split()))`,
     complexity:`Time O(n), Space O(n).`}
  ]},
  {name:"Sliding Window (String)", hint:"Maintain a moving window and adjust its size to satisfy character constraints.", problems:[
    {title:"Longest Substring Without Repeating Characters", diff:"Medium",
     statement:`Find the length of the longest substring without repeating characters.`,
     approach:`Same as Array > Sliding Window entry: last-seen-index hashmap with a variable window.`,
     code:`def lengthOfLongestSubstring(s: str) -> int:
    last_seen = {}
    left = 0
    best = 0
    for right, ch in enumerate(s):
        if ch in last_seen and last_seen[ch] >= left:
            left = last_seen[ch] + 1
        last_seen[ch] = right
        best = max(best, right - left + 1)
    return best`,
     complexity:`Time O(n), Space O(min(n, alphabet)).`},
    {title:"Find All Anagrams in a String", diff:"Medium",
     statement:`Given s and p, return the starting indices of all substrings of s that are anagrams of p.`,
     approach:`Fixed-size sliding window of length len(p); record every index where the window's 26-letter frequency array equals p's.`,
     code:`def findAnagrams(s: str, p: str) -> list[int]:
    n1, n2 = len(p), len(s)
    if n1 > n2:
        return []
    need = [0] * 26
    window = [0] * 26
    for ch in p:
        need[ord(ch) - 97] += 1
    result = []
    for i in range(n2):
        window[ord(s[i]) - 97] += 1
        if i >= n1:
            window[ord(s[i - n1]) - 97] -= 1
        if i >= n1 - 1 and window == need:
            result.append(i - n1 + 1)
    return result`,
     complexity:`Time O(26*n), Space O(1).`},
    {title:"Minimum Window Substring", diff:"Hard",
     statement:`Given s and t, find the smallest substring of s that contains all characters of t (with multiplicity).`,
     approach:`Same as Array > Sliding Window entry: need/window/formed counters with a variable window.`,
     code:`def minWindow(s: str, t: str) -> str:
    from collections import Counter
    if not s or not t:
        return ""
    need = Counter(t)
    window = {}
    required = len(need)
    formed = 0
    left = 0
    best_len, best_l, best_r = float('inf'), 0, 0

    for right, ch in enumerate(s):
        window[ch] = window.get(ch, 0) + 1
        if ch in need and window[ch] == need[ch]:
            formed += 1

        while formed == required:
            if right - left + 1 < best_len:
                best_len = right - left + 1
                best_l, best_r = left, right
            left_ch = s[left]
            window[left_ch] -= 1
            if left_ch in need and window[left_ch] < need[left_ch]:
                formed -= 1
            left += 1

    return "" if best_len == float('inf') else s[best_l:best_r + 1]`,
     complexity:`Time O(|s| + |t|), Space O(|s| + |t|).`},
    {title:"Longest Substring with At Most K Distinct Characters", diff:"Medium",
     statement:`Find the length of the longest substring containing at most k distinct characters.`,
     approach:`Variable window with a frequency map; shrink from left whenever distinct-key count exceeds k.`,
     code:`def lengthOfLongestSubstringKDistinct(s: str, k: int) -> int:
    from collections import defaultdict
    count = defaultdict(int)
    left = 0
    best = 0
    for right, ch in enumerate(s):
        count[ch] += 1
        while len(count) > k:
            count[s[left]] -= 1
            if count[s[left]] == 0:
                del count[s[left]]
            left += 1
        best = max(best, right - left + 1)
    return best`,
     complexity:`Time O(n), Space O(k).`},
    {title:"Repeated DNA Sequences", diff:"Medium",
     statement:`Given a DNA string of A/C/G/T, find all 10-letter substrings that occur more than once.`,
     approach:`Slide a fixed window of size 10, hashing each window in a count map; emit a sequence once its count reaches exactly 2.`,
     code:`def findRepeatedDnaSequences(s: str) -> list[str]:
    from collections import defaultdict
    count = defaultdict(int)
    result = []
    for i in range(len(s) - 9):
        seq = s[i:i + 10]
        count[seq] += 1
        if count[seq] == 2:
            result.append(seq)
    return result`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Group Anagrams", diff:"Medium",
     statement:`Given an array of strings, group the anagrams together.`,
     approach:`Anagrams share identical character-frequency signatures; use the sorted string (or letter-count tuple) as a hashmap key.`,
     code:`def groupAnagrams(strs: list[str]) -> list[list[str]]:
    from collections import defaultdict
    groups = defaultdict(list)
    for word in strs:
        key = tuple(sorted(word))
        groups[key].append(word)
    return list(groups.values())`,
     complexity:`Time O(n*k log k), Space O(n*k).`}
  ]}
]},
{topic:"HashMap", desc:"Key-value pair data structure for O(1) average time complexity lookups.", subs:[
  {name:"Frequency Map / Counting", hint:"Count elements to find the majority, top-k frequent, or sort by frequency.", problems:[
    {title:"Majority Element", diff:"Easy",
     statement:`Given an array where one element appears more than n/2 times, find that element.`,
     approach:`Boyer-Moore voting: maintain a candidate and counter; matching increments, mismatch decrements; counter hitting zero adopts a new candidate. The majority element survives as the final candidate.`,
     code:`def majorityElement(nums: list[int]) -> int:
    candidate, count = None, 0
    for v in nums:
        if count == 0:
            candidate = v
        count += 1 if v == candidate else -1
    return candidate`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Top K Frequent Elements", diff:"Medium",
     statement:`Given an array, return the k most frequent elements.`,
     approach:`Count frequencies with a hashmap, then use a heap to pull the k highest-count elements, avoiding a full sort of all distinct values.`,
     code:`def topKFrequent(nums: list[int], k: int) -> list[int]:
    from collections import Counter
    import heapq
    count = Counter(nums)
    return heapq.nlargest(k, count.keys(), key=count.get)`,
     complexity:`Time O(n log k), Space O(n).`},
    {title:"Sort Characters By Frequency", diff:"Medium",
     statement:`Given a string, sort its characters by decreasing frequency.`,
     approach:`Count frequencies, sort distinct characters by descending count, rebuild the string by repeating each character per its count.`,
     code:`def frequencySort(s: str) -> str:
    from collections import Counter
    count = Counter(s)
    return "".join(ch * freq for ch, freq in count.most_common())`,
     complexity:`Time O(n log n), Space O(n).`},
    {title:"Valid Anagram", diff:"Easy",
     statement:`Given two strings, determine if one is an anagram of the other.`,
     approach:`Two strings are anagrams iff equal length and identical character-frequency counts.`,
     code:`def isAnagram(s: str, t: str) -> bool:
    if len(s) != len(t):
        return False
    from collections import Counter
    return Counter(s) == Counter(t)`,
     complexity:`Time O(n), Space O(1) (bounded alphabet).`}
  ]},
  {name:"Prefix-Sum with Map", hint:"Track cumulative sums; the map stores first occurrence to solve subarray-sum problems.", problems:[
    {title:"Subarray Sum Equals K", diff:"Medium",
     statement:`Count the number of contiguous subarrays whose sum equals k.`,
     approach:`Same as Array > Prefix Sum entry: running prefix sum + hashmap of prefix-sum occurrence counts.`,
     code:`def subarraySum(nums: list[int], k: int) -> int:
    from collections import defaultdict
    count = defaultdict(int)
    count[0] = 1
    running = 0
    result = 0
    for v in nums:

        result += count[running - k]

{topic:"Binary Search", desc:"Efficient search algorithm that divides the search interval in half.", subs:[
  {name:"Classic Binary Search", hint:"Divide-and-conquer to narrow the search space in a sorted array.", problems:[
    {title:"Binary Search", diff:"Easy",
     statement:`Given a sorted array of unique integers and a target, return its index or -1 if not found.`,
     approach:`Standard binary search: compare the middle element to the target and halve the search range each step.`,
     code:`def search(nums: list[int], target: int) -> int:
    lo, hi = 0, len(nums) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if nums[mid] == target:
            return mid
        elif nums[mid] < target:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1`,
     complexity:`Time O(log n), Space O(1).`},
    {title:"Search Insert Position", diff:"Easy",
     statement:`Given a sorted array and a target, return the index if found, or the index where it would be inserted to keep the array sorted.`,
     approach:`This is exactly the "lower bound" binary search: find the leftmost index where nums[mid] >= target.`,
     code:`def searchInsert(nums: list[int], target: int) -> int:
    lo, hi = 0, len(nums)
    while lo < hi:
        mid = (lo + hi) // 2
        if nums[mid] < target:
            lo = mid + 1
        else:
            hi = mid
    return lo`,
     complexity:`Time O(log n), Space O(1).`},
    {title:"Search in Rotated Sorted Array", diff:"Medium",
     statement:`Given a sorted array rotated at an unknown pivot, and a target, return its index or -1.`,
     approach:`At each step, one half of [lo, mid] / [mid, hi] is guaranteed to be sorted (no rotation inside it). Determine which half is sorted, then check whether the target lies in that half's range to decide which side to keep searching.`,
     code:`def search(nums: list[int], target: int) -> int:
    lo, hi = 0, len(nums) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if nums[mid] == target:
            return mid
        if nums[lo] <= nums[mid]:
            if nums[lo] <= target < nums[mid]:
                hi = mid - 1
            else:
                lo = mid + 1
        else:
            if nums[mid] < target <= nums[hi]:
                lo = mid + 1
            else:
                hi = mid - 1
    return -1`,
     complexity:`Time O(log n), Space O(1).`},
    {title:"Find Minimum in Rotated Sorted Array", diff:"Medium",
     statement:`Given a sorted array rotated at an unknown pivot with no duplicates, find the minimum element.`,
     approach:`Compare nums[mid] to nums[hi]. If nums[mid] > nums[hi], the minimum must be to the right of mid (rotation point is there); otherwise it's at mid or to the left.`,
     code:`def findMin(nums: list[int]) -> int:
    lo, hi = 0, len(nums) - 1
    while lo < hi:
        mid = (lo + hi) // 2
        if nums[mid] > nums[hi]:
            lo = mid + 1
        else:
            hi = mid
    return nums[lo]`,
     complexity:`Time O(log n), Space O(1).`},
    {title:"Peak Index in a Mountain Array", diff:"Medium",
     statement:`Given a mountain array (strictly increasing then strictly decreasing), find the index of the peak.`,
     approach:`Compare arr[mid] to arr[mid+1]. If arr[mid] < arr[mid+1], we're still on the ascending slope so the peak is to the right; otherwise the peak is at mid or to the left.`,
     code:`def peakIndexInMountainArray(arr: list[int]) -> int:
    lo, hi = 0, len(arr) - 1
    while lo < hi:
        mid = (lo + hi) // 2
        if arr[mid] < arr[mid + 1]:
            lo = mid + 1
        else:
            hi = mid
    return lo`,
     complexity:`Time O(log n), Space O(1).`},
    {title:"Search a 2D Matrix", diff:"Medium",
     statement:`Given an m x n matrix where each row is sorted and the first element of each row is greater than the last element of the previous row, search for a target value.`,
     approach:`The whole matrix is effectively one sorted 1D array of length m*n. Binary search over that virtual index space, converting mid to (row, col) via divmod by the row width.`,
     code:`def searchMatrix(matrix: list[list[int]], target: int) -> bool:
    m, n = len(matrix), len(matrix[0])
    lo, hi = 0, m * n - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        val = matrix[mid // n][mid % n]
        if val == target:
            return True
        elif val < target:
            lo = mid + 1
        else:
            hi = mid - 1
    return False`,
     complexity:`Time O(log(m*n)), Space O(1).`}
  ]},
  {name:"Lower / Upper Bound", hint:"Find the first/last occurrence or smallest/largest index satisfying a condition.", problems:[
    {title:"Find First and Last Position of Element in Sorted Array", diff:"Medium",
     statement:`Given a sorted array, find the starting and ending index of a given target value.`,
     approach:`Run two lower-bound binary searches: one for the leftmost index where nums[mid] >= target, and one (using a strict "<=" trick) for the leftmost index past the last occurrence, then subtract 1.`,
     code:`def searchRange(nums: list[int], target: int) -> list[int]:
    def find(leftmost):
        lo, hi = 0, len(nums)
        while lo < hi:
            mid = (lo + hi) // 2
            if nums[mid] < target or (not leftmost and nums[mid] == target):
                lo = mid + 1
            else:
                hi = mid
        return lo

    left = find(True)
    if left == len(nums) or nums[left] != target:
        return [-1, -1]
    right = find(False) - 1
    return [left, right]`,
     complexity:`Time O(log n), Space O(1).`},
    {title:"First Bad Version", diff:"Easy",
     statement:`Given versions 1..n where all versions after a first bad version are also bad, and an API isBadVersion(v), find the first bad version using the minimum number of calls.`,
     approach:`Lower-bound binary search on the boolean predicate isBadVersion: find the leftmost version for which it returns true.`,
     code:`def firstBadVersion(n: int, isBadVersion) -> int:
    lo, hi = 1, n
    while lo < hi:
        mid = lo + (hi - lo) // 2
        if isBadVersion(mid):
            hi = mid
        else:
            lo = mid + 1
    return lo`,
     complexity:`Time O(log n), Space O(1).`},
    {title:"H-Index II", diff:"Medium",
     statement:`Given a sorted (ascending) array of citation counts, find the researcher's h-index.`,
     approach:`Binary search for the leftmost index mid where citations[mid] >= n - mid (meaning n - mid papers have at least that many citations). The answer is n - lo once the search converges.`,
     code:`def hIndex(citations: list[int]) -> int:
    n = len(citations)
    lo, hi = 0, n - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if citations[mid] >= n - mid:
            hi = mid - 1
        else:
            lo = mid + 1
    return n - lo`,
     complexity:`Time O(log n), Space O(1).`},
    {title:"Count of Smaller Numbers After Self", diff:"Hard",
     statement:`Given an array, return counts[i] = the number of elements to the right of i that are smaller than nums[i].`,
     approach:`Sort indices with a merge sort variant: whenever merging, an element taken from the right half before an element from the left half means that right-half value is smaller and appeared after — accumulate a running right_count and add it to each left-half element's total when it's finally placed.`,
     code:`def countSmaller(nums: list[int]) -> list[int]:
    n = len(nums)
    indices = list(range(n))
    counts = [0] * n

    def merge_sort(lst):
        if len(lst) <= 1:
            return lst

     code:`def findMedianSortedArrays(nums1: list[int], nums2: list[int]) -> float:
    if len(nums1) > len(nums2):
        nums1, nums2 = nums2, nums1
    m, n = len(nums1), len(nums2)
    lo, hi = 0, m
    while lo <= hi:
        i = (lo + hi) // 2
        j = (m + n + 1) // 2 - i
        left1 = nums1[i - 1] if i > 0 else float('-inf')
        right1 = nums1[i] if i < m else float('inf')
        left2 = nums2[j - 1] if j > 0 else float('-inf')

        row, col = n - 1, 0

            if matrix[row][col] <= x:
                cnt += row + 1
                col += 1
            else:
                row -= 1
        return cnt

    while lo < hi:
        mid = (lo + hi) // 2
        if count_le(mid) < k:
            lo = mid + 1
        else:

     statement:`Given an m x n matrix where no two adjacent cells are equal, find any cell that is strictly greater than all its (up to four) neighbors.`,
     approach:`Binary search over rows. For the middle row, find its column-wise maximum. If that maximum is also bigger than the cell directly below it, the peak lies in the top half (including this row); if a cell below is bigger, the peak lies in the bottom half. This is a 1D "peak index" binary search lifted one dimension, using O(n) work per row to find the row's max.`,
     code:`def findPeakGrid(mat: list[list[int]]) -> list[int]:
    top, bottom = 0, len(mat) - 1
    while top <= bottom:
        mid = (top + bottom) // 2
        max_col = mat[mid].index(max(mat[mid]))
        up = mat[mid - 1][max_col] if mid > 0 else -1
        down = mat[mid + 1][max_col] if mid < len(mat) - 1 else -1
        if mat[mid][max_col] > up and mat[mid][max_col] > down:
            return [mid, max_col]
        elif down > mat[mid][max_col]:

        else:

    if len(arr) <= 1:

    pivot = arr[len(arr) // 2]
    left = [x for x in arr if x < pivot]

    {title:"Maximum Subarray (D&C)", diff:"Medium",

     approach:`Split the array in half. The best subarray either lies entirely in the left half, entirely in the right half, or crosses the midpoint. The crossing case is found by extending the best suffix sum ending at mid and the best prefix sum starting at mid+1.`,
     code:`def maxSubArrayDC(nums: list[int]) -> int:
    def helper(lo, hi):
        if lo == hi:
            return nums[lo]
        mid = (lo + hi) // 2
        left_max = helper(lo, mid)
        right_max = helper(mid + 1, hi)

        best_left, s = nums[mid], 0
        for i in range(mid, lo - 1, -1):
            s += nums[i]
            best_left = max(best_left, s)

        best_right, s = nums[mid + 1], 0
        for i in range(mid + 1, hi + 1):
            s += nums[i]
            best_right = max(best_right, s)

        cross = best_left + best_right
        return max(left_max, right_max, cross)

    if memo is None:
        memo = {}
    if expression in memo:
        return memo[expression]
    if expression.isdigit():
        return [int(expression)]

    results = []
    for i, ch in enumerate(expression):
        if ch in "+-*":
            left = diffWaysToCompute(expression[:i], memo)
            right = diffWaysToCompute(expression[i + 1:], memo)
            for l in left:
                for r in right:
                    if ch == '+':
                        results.append(l + r)
                    elif ch == '-':
                        results.append(l - r)
                    else:

     code:`import heapq

def getSkyline(buildings: list[list[int]]) -> list[list[int]]:
    events = []
    for l, r, h in buildings:
        events.append((l, -h, r))
        events.append((r, 0, 0))
    events.sort()

    result = []
    live = [(0, float('inf'))]  # (-height, end_x)
    for x, neg_h, r in events:
        while live[0][1] <= x:
            heapq.heappop(live)
        if neg_h != 0:
            heapq.heappush(live, (neg_h, r))
        cur_height = -live[0][0]
        if not result or result[-1][1] != cur_height:
            result.append([x, cur_height])
    return result`,

    def __init__(self, val=0, next=None):

def reverseList(head: ListNode) -> ListNode:

    new_head = reverseList(head.next)
    head.next.next = head

    insert_at_bottom(stack, top)

def insert_at_bottom(stack: list, item) -> None:
    if not stack:
        stack.append(item)
        return
    top = stack.pop()
    insert_at_bottom(stack, item)
    stack.append(top)`,
     complexity:`Time O(n^2), Space O(n) (call stack).`},
    {title:"Swap Nodes in Pairs", diff:"Medium",
     statement:`Given a linked list, swap every two adjacent nodes.`,
     approach:`Recursively swap the rest of the list first (from the third node onward), then swap the first pair, pointing the second node's next at the first node and the first node's next at the already-swapped remainder.`,
     code:`def swapPairs(head: ListNode) -> ListNode:
    if head is None or head.next is None:
        return head
    second = head.next
    head.next = swapPairs(second.next)
    second.next = head
    return second`,
     complexity:`Time O(n), Space O(n) (call stack).`},
    {title:"Remove Duplicates from Sorted List II", diff:"Medium",
     statement:`Given a sorted linked list, remove all nodes that have duplicate values, keeping only distinct values.`,
     approach:`If the head's value matches the next node's value, skip past every node with that same value entirely and recurse on what's left. Otherwise, keep the head and recursively process the rest of the list.`,
     code:`def deleteDuplicates(head: ListNode) -> ListNode:
    if head is None or head.next is None:
        return head
    if head.val == head.next.val:
        cur = head.next
        while cur and cur.val == head.val:
            cur = cur.next
        return deleteDuplicates(cur)
    else:
        head.next = deleteDuplicates(head.next)
        return head`,
     complexity:`Time O(n), Space O(n) (call stack).`}
  ]},
  {name:"Subsequences", hint:"Explore all subsets by choosing to include or exclude each element.", problems:[
    {title:"Subsets", diff:"Medium",
     statement:`Given an array of distinct integers, return all possible subsets (the power set).`,
     approach:`Backtracking: at each recursive call, first record the current path as a valid subset, then try extending it with each remaining element (only ones after the current start index, to avoid duplicate orderings), undoing the choice after each recursive branch.`,
     code:`def subsets(nums: list[int]) -> list[list[int]]:
    result = []

    def backtrack(start, path):
        result.append(path[:])
        for i in range(start, len(nums)):
            path.append(nums[i])
            backtrack(i + 1, path)
            path.pop()

    backtrack(0, [])
    return result`,
     complexity:`Time O(n * 2^n), Space O(n) (call stack) plus O(2^n) output.`},
    {title:"Letter Case Permutation", diff:"Medium",
     statement:`Given a string of letters and digits, return all strings obtainable by transforming each letter into lowercase or uppercase (digits stay unchanged).`,
     approach:`At each character, branch: if it's a letter, recurse once with it lowercased and once uppercased; if it's a digit, there's only one choice. Undo the character after each branch (standard backtracking).`,
     code:`def letterCasePermutation(s: str) -> list[str]:
    result = []

    def backtrack(idx, path):
        if idx == len(s):
            result.append("".join(path))
            return
        ch = s[idx]
        if ch.isalpha():
            path.append(ch.lower())
            backtrack(idx + 1, path)
            path.pop()
            path.append(ch.upper())
            backtrack(idx + 1, path)
            path.pop()
        else:
            path.append(ch)
            backtrack(idx + 1, path)
            path.pop()

    backtrack(0, [])
    return result`,
     complexity:`Time O(n * 2^L) where L is the number of letters, Space O(n).`},
    {title:"Generate Parentheses", diff:"Medium",
     statement:`Given n pairs of parentheses, generate all combinations of well-formed parenthesis strings.`,
     approach:`Backtrack, tracking counts of opens and closes used so far. Only add '(' if fewer than n opens have been used; only add ')' if fewer closes than opens have been used so far (guaranteeing validity at every prefix).`,
     code:`def generateParenthesis(n: int) -> list[str]:
    result = []

    def backtrack(path, open_count, close_count):
        if len(path) == 2 * n:
            result.append("".join(path))
            return
        if open_count < n:
            path.append('(')
            backtrack(path, open_count + 1, close_count)
            path.pop()
        if close_count < open_count:
            path.append(')')
            backtrack(path, open_count, close_count + 1)
            path.pop()

    backtrack([], 0, 0)
    return result`,
     complexity:`Time O(4^n / sqrt(n)) (Catalan-number growth), Space O(n) (call stack).`}
  ]}
]}
