{topic:"Stack", desc:"LIFO (Last In First Out) data structure patterns.", subs:[
  {name:"Monotonic Stack", hint:"Keep a monotonic stack to find next/prev greater or smaller, histogram ranges, or collisions.", problems:[
    {title:"Next Greater Element I", diff:"Easy",
     statement:`Given two arrays where nums1 is a subset of nums2, for each element of nums1 find its next greater element in nums2, or -1 if none exists.`,
     approach:`Build a "next greater" map for every element of nums2 in one pass using a decreasing monotonic stack: whenever the current number is bigger than the stack's top, that top has found its next-greater value, so pop and record it. Then look up each nums1 element in the map.`,
     code:`def nextGreaterElement(nums1: list[int], nums2: list[int]) -> list[int]:
    next_greater = {}
    stack = []
    for num in nums2:
        while stack and stack[-1] < num:
            next_greater[stack.pop()] = num
        stack.append(num)
    return [next_greater.get(n, -1) for n in nums1]`,
     complexity:`Time O(m + n), Space O(n).`},
    {title:"Daily Temperatures", diff:"Medium",
     statement:`Given daily temperatures, return for each day the number of days to wait for a warmer temperature (0 if none).`,
     approach:`Keep a decreasing monotonic stack of indices whose "warmer day" hasn't been found yet. Whenever the current temperature beats the stack's top, pop it and record the day gap.`,
     code:`def dailyTemperatures(temperatures: list[int]) -> list[int]:
    result = [0] * len(temperatures)
    stack = []
    for i, t in enumerate(temperatures):
        while stack and temperatures[stack[-1]] < t:
            j = stack.pop()
            result[j] = i - j
        stack.append(i)
    return result`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Largest Rectangle in Histogram", diff:"Hard",
     statement:`Given bar heights of a histogram, find the area of the largest rectangle that fits within it.`,
     approach:`Maintain an increasing monotonic stack of bar indices. When a shorter bar is encountered, pop taller bars and compute the rectangle they could have formed — width is the gap between the current index and the new stack top (or from the start if empty). Appending a sentinel 0-height bar at the end flushes everything remaining.`,
     code:`def largestRectangleArea(heights: list[int]) -> int:
    stack = []
    max_area = 0
    heights = heights + [0]
    for i, h in enumerate(heights):
        while stack and heights[stack[-1]] > h:
            height = heights[stack.pop()]
            width = i if not stack else i - stack[-1] - 1
            max_area = max(max_area, height * width)
        stack.append(i)
    return max_area`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Trapping Rain Water", diff:"Hard",
     statement:`Given non-negative heights forming an elevation map, compute how much water it can trap after raining.`,
     approach:`Identical problem and solution to the entry under Array > Two-Pointer. See that entry for the two-pointer O(n)/O(1) walkthrough. (A monotonic-stack solution also exists but the two-pointer version is simpler and equally efficient.)`,
     code:`# See "Trapping Rain Water" under Array > Two-Pointer —
# identical two-pointer O(n)/O(1) solution.`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Asteroid Collision", diff:"Medium",
     statement:`Given asteroids moving right (positive) or left (negative) at the same speed, simulate collisions — the smaller asteroid explodes, equal ones both explode — and return the final state.`,
     approach:`Process left to right with a stack representing currently "surviving" asteroids moving right (they can still collide with a future left-mover). A new left-moving asteroid only threatens the stack's top if that top is moving right; resolve any such collisions before deciding whether the new asteroid survives to be pushed.`,
     code:`def asteroidCollision(asteroids: list[int]) -> list[int]:
    stack = []
    for a in asteroids:
        alive = True
        while alive and a < 0 and stack and stack[-1] > 0:
            if stack[-1] < -a:
                stack.pop()
                continue
            elif stack[-1] == -a:
                stack.pop()
            alive = False
        if alive:
            stack.append(a)
    return stack`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Online Stock Span", diff:"Medium",
     statement:`Design a class that, given daily stock prices one at a time, returns the "span" — the number of consecutive previous days (including today) with price <= today's price.`,
     approach:`Keep a stack of (price, span) pairs. When a new price arrives, pop and absorb every entry whose price is <= the new price (their spans get folded into the new entry's span), since they're now all "covered" by today.`,
     code:`class StockSpanner:
    def __init__(self):
        self.stack = []  # (price, span)

    def next(self, price: int) -> int:
        span = 1
        while self.stack and self.stack[-1][0] <= price:
            span += self.stack.pop()[1]
        self.stack.append((price, span))
        return span`,
     complexity:`Time O(1) amortized per call, Space O(n).`},
    {title:"Sum of Subarray Minimums", diff:"Medium",
     statement:`Given an array, find the sum of the minimum values of every contiguous subarray, modulo 10^9+7.`,
     approach:`For each element, count how many subarrays have it as the minimum: that's (distance to the previous strictly-smaller element) * (distance to the next strictly-smaller-or-equal element). Compute both distances in linear time with two monotonic-stack passes, then sum value*left*right for every index.`,
     code:`def sumSubarrayMins(arr: list[int]) -> int:
    MOD = 10**9 + 7
    n = len(arr)
    left, right = [0] * n, [0] * n
    stack = []
    for i in range(n):
        while stack and arr[stack[-1]] >= arr[i]:
            stack.pop()
        left[i] = i - (stack[-1] if stack else -1)
        stack.append(i)
    stack = []
    for i in range(n - 1, -1, -1):
        while stack and arr[stack[-1]] > arr[i]:
            stack.pop()
        right[i] = (stack[-1] if stack else n) - i
        stack.append(i)
    return sum(arr[i] * left[i] * right[i] for i in range(n)) % MOD`,
     complexity:`Time O(n), Space O(n).`}
  ]},
  {name:"Expression Evaluation", hint:"Use two stacks or postfix evaluation to handle numbers and operators.", problems:[
    {title:"Evaluate Reverse Polish Notation", diff:"Medium",
     statement:`Evaluate an arithmetic expression given in Reverse Polish (postfix) Notation.`,
     approach:`Scan tokens left to right. A number is pushed; an operator pops the top two operands, applies itself, and pushes the result back.`,
     code:`def evalRPN(tokens: list[str]) -> int:
    stack = []
    for tok in tokens:
        if tok in ('+', '-', '*', '/'):
            b = stack.pop()
            a = stack.pop()
            if tok == '+': stack.append(a + b)
            elif tok == '-': stack.append(a - b)
            elif tok == '*': stack.append(a * b)
            else: stack.append(int(a / b))
        else:
            stack.append(int(tok))
    return stack[0]`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Basic Calculator", diff:"Hard",
     statement:`Implement a calculator that evaluates an expression string containing +, -, parentheses, and non-negative integers (no * or /).`,
     approach:`Track a running result and current sign while accumulating digits into a number. On '(', push the current result and sign onto a stack and reset; on ')', fold the parenthesized result back using the popped sign and outer result.`,
     code:`def calculate(s: str) -> int:
    stack = []
    sign = 1
    result = 0
    num = 0
    for ch in s:
        if ch.isdigit():
            num = num * 10 + int(ch)
        elif ch == '+':
            result += sign * num
            num = 0
            sign = 1
        elif ch == '-':
            result += sign * num
            num = 0
            sign = -1
        elif ch == '(':
            stack.append(result)
            stack.append(sign)
            result = 0
            sign = 1
        elif ch == ')':
            result += sign * num
            num = 0
            result *= stack.pop()
            result += stack.pop()
            sign = 1
    result += sign * num
    return result`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Basic Calculator II", diff:"Medium",
     statement:`Implement a calculator that evaluates an expression string containing +, -, *, / and non-negative integers (no parentheses), respecting operator precedence.`,
     approach:`Track the previous operator seen. For +/- push the (signed) number directly. For * and /, pop the last pushed number, apply the operation immediately, and push the result back — this handles precedence without an explicit precedence table since the stack only ever holds "resolved" addends.`,
     code:`def calculate(s: str) -> int:
    stack = []
    num = 0
    sign = '+'
    s = s.replace(' ', '') + '+'
    for ch in s:
        if ch.isdigit():
            num = num * 10 + int(ch)
        else:
            if sign == '+': stack.append(num)
            elif sign == '-': stack.append(-num)
            elif sign == '*': stack.append(stack.pop() * num)
            elif sign == '/':
                prev = stack.pop()
                stack.append(int(prev / num))
            sign = ch
            num = 0
    return sum(stack)`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Decode String", diff:"Medium",
     statement:`Given an encoded string like "3[a2[c]]", decode it by expanding k[...] into k repetitions of its contents (nesting allowed).`,
     approach:`Use a stack of (partial_string, repeat_count) frames. On '[', push a fresh frame with the pending number. On ']', pop the completed frame and fold it (repeated k times) into the string just below it on the stack. Plain characters get appended to the current top frame's string.`,
     code:`def decodeString(s: str) -> str:
    stack = [["", 1]]
    num = ""
    for ch in s:
        if ch.isdigit():
            num += ch
        elif ch == '[':
            stack.append(["", int(num)])
            num = ""
        elif ch == ']':
            st, k = stack.pop()
            stack[-1][0] += st * k
        else:
            stack[-1][0] += ch
    return stack[0][0]`,
     complexity:`Time O(n * max_repeat), Space O(n).`}
  ]},
  {name:"Stack Simulation / Undo Operation", hint:"Simulate operations with a stack — pop on undo, remove adjacent duplicates, collapse characters.", problems:[
    {title:"Valid Parentheses", diff:"Easy",
     statement:`Given a string of brackets ( ) [ ] { }, determine if it is valid (every opening bracket is closed by the same type, in the correct order).`,
     approach:`Push every opening bracket. On a closing bracket, it must match the most recently opened (top of stack) bracket — if not, or if the stack is empty, the string is invalid.`,
     code:`def isValid(s: str) -> bool:
    stack = []
    pairs = {')': '(', ']': '[', '}': '{'}
    for ch in s:
        if ch in '([{':
            stack.append(ch)
        else:
            if not stack or stack[-1] != pairs[ch]:
                return False
            stack.pop()
    return not stack`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Remove All Adjacent Duplicates In String", diff:"Easy",
     statement:`Repeatedly remove adjacent pairs of identical letters until no more removals are possible; return the final string.`,
     approach:`Push characters onto a stack; whenever the incoming character equals the stack's top, they cancel — pop instead of pushing.`,
     code:`def removeDuplicates(s: str) -> str:
    stack = []
    for ch in s:
        if stack and stack[-1] == ch:
            stack.pop()
        else:
            stack.append(ch)
    return "".join(stack)`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Backspace String Compare", diff:"Easy",
     statement:`Given two strings containing letters and '#' (backspace, deletes the previous character), determine if they represent the same final string after applying all backspaces.`,
     approach:`Build each string's final form with a stack: normal characters push, '#' pops (if non-empty). Compare the two resulting stacks.`,
     code:`def backspaceCompare(s: str, t: str) -> bool:
    def build(string):
        stack = []
        for ch in string:
            if ch != '#':
                stack.append(ch)
            elif stack:
                stack.pop()
        return "".join(stack)
    return build(s) == build(t)`,
     complexity:`Time O(n + m), Space O(n + m).`},
    {title:"Remove K Digits", diff:"Medium",
     statement:`Given a non-negative integer string and k, remove k digits to make the smallest possible number (no leading zeroes, unless the result is "0").`,
     approach:`Greedy monotonic increasing stack: whenever the current digit is smaller than the stack's top and we still have removals left, pop the top (removing a "worse" leading digit makes the number smaller). If removals remain after the scan, trim from the end. Finally strip leading zeroes.`,
     code:`def removeKdigits(num: str, k: int) -> str:
    stack = []
    for digit in num:
        while k and stack and stack[-1] > digit:
            stack.pop()
            k -= 1
        stack.append(digit)
    while k:
        stack.pop()
        k -= 1
    result = "".join(stack).lstrip('0')
    return result if result else "0"`,
     complexity:`Time O(n), Space O(n).`}
  ]},
  {name:"Parenthesis & Scoring", hint:"Track balance, nesting depth, or a running score for parenthesis strings.", problems:[
    {title:"Valid Parentheses", diff:"Easy",
     statement:`Given a string of brackets, determine if it is valid.`,
     approach:`Identical problem and solution to the entry under Stack Simulation / Undo Operation. See that entry.`,
     code:`# See "Valid Parentheses" under Stack Simulation / Undo Operation —
# identical bracket-matching-stack solution.`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Score of Parentheses", diff:"Medium",
     statement:`Given a balanced parentheses string, compute its score: "()" = 1, AB (concatenation) = A's score + B's score, and (A) = 2 * A's score.`,
     approach:`Use a stack of partial scores, one frame per open bracket depth. On '(', push a fresh 0. On ')', pop the innermost score; if it was 0 (an immediate "()"), it contributes 1, otherwise it contributes double; fold that contribution into the new top of stack (the enclosing depth).`,
     code:`def scoreOfParentheses(s: str) -> int:
    stack = [0]
    for ch in s:
        if ch == '(':
            stack.append(0)
        else:
            v = stack.pop()
            stack[-1] += max(2 * v, 1)
    return stack[0]`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Minimum Add to Make Parentheses Valid", diff:"Medium",
     statement:`Given a string of parentheses, find the minimum number of parentheses to add to make it valid.`,
     approach:`Track how many unmatched '(' are currently open. Each ')' either closes one of them, or (if none are open) is itself unmatched and needs a future '(' inserted. The answer is unmatched opens remaining plus unmatched closes encountered.`,
     code:`def minAddToMakeValid(s: str) -> int:
    open_needed = 0
    close_needed = 0
    for ch in s:
        if ch == '(':
            open_needed += 1
        else:
            if open_needed > 0:
                open_needed -= 1
            else:
                close_needed += 1
    return open_needed + close_needed`,
     complexity:`Time O(n), Space O(1).`},
    {title:"Longest Valid Parentheses", diff:"Hard",
     statement:`Given a string of ( and ), find the length of the longest valid (well-formed) parentheses substring.`,
     approach:`Keep a stack of indices, seeded with -1 as a base marker. Push indices of '('. On ')', pop; if the stack becomes empty, this ')' has no matching base so push its own index as the new base. Otherwise the current valid-substring length is the distance from the current index to the new top of stack.`,
     code:`def longestValidParentheses(s: str) -> int:
    stack = [-1]
    best = 0
    for i, ch in enumerate(s):
        if ch == '(':
            stack.append(i)
        else:
            stack.pop()
            if not stack:
                stack.append(i)
            else:
                best = max(best, i - stack[-1])
    return best`,
     complexity:`Time O(n), Space O(n).`}
  ]},
  {name:"Stack-Based Design", hint:"Design a stack variant supporting extra operations like min, increment, or max-pop.", problems:[
    {title:"Min Stack", diff:"Medium",
     statement:`Design a stack supporting push, pop, top, and retrieving the minimum element, all in O(1).`,
     approach:`Maintain a parallel stack that, at each position, stores the minimum seen from the bottom up to that position. Pushing computes min(new value, current min); popping pops both stacks together.`,
     code:`class MinStack:
    def __init__(self):
        self.stack = []
        self.min_stack = []

    def push(self, val: int) -> None:
        self.stack.append(val)
        m = val if not self.min_stack else min(val, self.min_stack[-1])
        self.min_stack.append(m)

    def pop(self) -> None:
        self.stack.pop()
        self.min_stack.pop()

    def top(self) -> int:
        return self.stack[-1]

    def getMin(self) -> int:
        return self.min_stack[-1]`,
     complexity:`Time O(1) per operation, Space O(n).`},
    {title:"Implement Queue using Stacks", diff:"Easy",
     statement:`Implement a FIFO queue using only two stacks.`,
     approach:`Push always goes onto an "in" stack. To pop or peek, if the "out" stack is empty, drain the entire "in" stack into it (which reverses the order), then operate on "out". This amortizes each element's reversal cost across all its future pops.`,
     code:`class MyQueue:
    def __init__(self):
        self.in_stack = []
        self.out_stack = []

    def push(self, x: int) -> None:
        self.in_stack.append(x)

    def _transfer(self):
        if not self.out_stack:
            while self.in_stack:
                self.out_stack.append(self.in_stack.pop())

    def pop(self) -> int:
        self._transfer()
        return self.out_stack.pop()

    def peek(self) -> int:
        self._transfer()
        return self.out_stack[-1]

    def empty(self) -> bool:
        return not self.in_stack and not self.out_stack`,
     complexity:`Time O(1) amortized per operation, Space O(n).`},
    {title:"Implement Stack using Queues", diff:"Easy",
     statement:`Implement a LIFO stack using only one queue.`,
     approach:`After pushing a new element to the back of the queue, rotate the queue by popping-and-re-pushing every other element in front of it — this moves the new element to the front, making the queue's front always the most-recently-pushed item (i.e. behave like a stack top).`,
     code:`from collections import deque

class MyStack:
    def __init__(self):
        self.q = deque()

    def push(self, x: int) -> None:
        self.q.append(x)
        for _ in range(len(self.q) - 1):
            self.q.append(self.q.popleft())

    def pop(self) -> int:
        return self.q.popleft()

    def top(self) -> int:
        return self.q[0]

    def empty(self) -> bool:
        return not self.q`,
     complexity:`Time O(n) push (rotation), O(1) pop/top. Space O(n).`},
    {title:"Design a Stack With Increment Operation", diff:"Medium",
     statement:`Design a stack with a fixed max size supporting push, pop, and increment(k, val) which adds val to the bottom k elements.`,
     approach:`Store elements in a plain list capped at maxSize. increment simply adds val to the bottom min(k, current size) elements directly — straightforward since k and stack size are both bounded and the operation is infrequent relative to push/pop in typical use.`,
     code:`class CustomStack:
    def __init__(self, maxSize: int):
        self.max_size = maxSize
        self.stack = []

    def push(self, x: int) -> None:
        if len(self.stack) < self.max_size:
            self.stack.append(x)

    def pop(self) -> int:
        return self.stack.pop() if self.stack else -1

    def increment(self, k: int, val: int) -> None:
        for i in range(min(k, len(self.stack))):
            self.stack[i] += val`,
     complexity:`Time O(1) push/pop, O(k) increment. Space O(maxSize).`},
    {title:"Max Stack", diff:"Hard",
     statement:`Design a stack supporting push, pop, top, peekMax, and popMax (remove the maximum element, even if it isn't on top, keeping the rest of the stack's relative order).`,
     approach:`Tag every pushed value with a unique id, keep a max-heap of (value, id) for fast max lookup, and track a "removed" id set for lazy deletion — popMax removes the max-heap's top and marks its id removed rather than physically restructuring the underlying stack; the stack itself lazily skips past removed ids when accessed.`,
     code:`import heapq

class MaxStack:
    def __init__(self):
        self.stack = []
        self.removed = set()
        self.heap = []
        self.id = 0

    def push(self, x: int) -> None:
        self.id += 1
        self.stack.append((x, self.id))
        heapq.heappush(self.heap, (-x, -self.id))

    def pop(self) -> int:
        while self.stack[-1][1] in self.removed:
            self.stack.pop()
        x, i = self.stack.pop()
        self.removed.add(i)
        return x

    def top(self) -> int:
        while self.stack[-1][1] in self.removed:
            self.stack.pop()
        return self.stack[-1][0]

    def peekMax(self) -> int:
        while -self.heap[0][1] in self.removed:
            heapq.heappop(self.heap)
        return -self.heap[0][0]

    def popMax(self) -> int:
        while -self.heap[0][1] in self.removed:
            heapq.heappop(self.heap)
        x, neg_i = heapq.heappop(self.heap)
        self.removed.add(-neg_i)
        return -x`,
     complexity:`Time O(log n) amortized per operation, Space O(n).`}
  ]},
  {name:"Stack + Greedy", hint:"Combine a monotonic stack with a greedy choice to build an optimal string or subsequence.", problems:[
    {title:"Remove Duplicate Letters", diff:"Medium",
     statement:`Given a string, remove duplicate letters so every letter appears exactly once, keeping the result the smallest possible in lexicographic order (and preserving relative order of first occurrences).`,
     approach:`Greedy monotonic stack: for each character, if it's not already in the result, pop any stack-top character that is lexicographically larger AND still has a later occurrence available (so removing it now doesn't lose it forever). Track a "last occurrence index" map and an in-stack set to make both checks O(1).`,
     code:`def removeDuplicateLetters(s: str) -> str:
    last_occurrence = {ch: i for i, ch in enumerate(s)}
    stack = []
    in_stack = set()
    for i, ch in enumerate(s):
        if ch in in_stack:
            continue
        while stack and stack[-1] > ch and last_occurrence[stack[-1]] > i:
            in_stack.remove(stack.pop())
        stack.append(ch)
        in_stack.add(ch)
    return "".join(stack)`,
     complexity:`Time O(n), Space O(1) (bounded alphabet).`},
    {title:"Remove K Digits", diff:"Medium",
     statement:`Given a non-negative integer string and k, remove k digits to make the smallest possible number.`,
     approach:`Identical problem and solution to the entry under Stack Simulation / Undo Operation — the greedy monotonic increasing stack. See that entry.`,
     code:`# See "Remove K Digits" under Stack Simulation / Undo Operation —
# identical greedy monotonic-stack solution.`,
     complexity:`Time O(n), Space O(n).`},
    {title:"132 Pattern", diff:"Medium",
     statement:`Given an array, determine if there exists a subsequence nums[i] < nums[k] < nums[j] with i < j < k (a "1-3-2" pattern).`,
     approach:`Scan left to right, treating each element as a candidate "3" (the largest of the triple). Keep a decreasing stack of (candidate_three, min_value_seen_before_it) pairs. Pop any stack entries whose "3" value is <= the current number (they can never be the "3" of a valid pattern anymore). If the current number falls strictly between a stack entry's stored min-before and that entry's value, a valid "1 < 2 < 3" pattern (read as k=current, j=entry, i=stored min) has been found.`,
     code:`def find132pattern(nums: list[int]) -> bool:
    stack = []  # (candidate "3", min value seen before it)
    min_so_far = float('inf')
    for num in nums:
        while stack and stack[-1][0] <= num:
            stack.pop()
        if stack and stack[-1][1] < num < stack[-1][0]:
            return True
        stack.append((num, min_so_far))
        min_so_far = min(min_so_far, num)
    return False`,
     complexity:`Time O(n), Space O(n).`},
    {title:"Create Maximum Number", diff:"Hard",
     statement:`Given two arrays of digits and an integer k, create the maximum number of length k using digits from both arrays (preserving each array's relative digit order), choosing how many digits to take from each.`,
     approach:`For every valid split (i digits from nums1, k-i from nums2), extract the lexicographically maximum length-i subsequence from each array using a greedy monotonic decreasing stack, then merge the two chosen subsequences greedily (always take from whichever remaining suffix is lexicographically larger). Keep the best merged result across all splits.`,
     code:`def maxNumber(nums1: list[int], nums2: list[int], k: int) -> list[int]:
    def max_subsequence(nums, length):
        stack = []
        drop = len(nums) - length
        for num in nums:
            while stack and drop > 0 and stack[-1] < num:
                stack.pop()
                drop -= 1
            stack.append(num)
        return stack[:length]

    def merge(a, b):
        result = []
        while a or b:
            if a > b:
                result.append(a[0]); a = a[1:]
            else:
                result.append(b[0]); b = b[1:]
        return result

    result = [0] * k
    for i in range(max(0, k - len(nums2)), min(k, len(nums1)) + 1):
        candidate = merge(max_subsequence(nums1, i), max_subsequence(nums2, k - i))
        if candidate > result:
            result = candidate
    return result`,
     complexity:`Time O(k * (m+n)^2) in the worst case (dominated by list-slicing comparisons), Space O(m+n).`},
    {title:"Smallest Subsequence of Distinct Characters", diff:"Medium",
     statement:`Given a string of lowercase letters, return the lexicographically smallest subsequence that contains every distinct character exactly once.`,
     approach:`This is the exact same problem as Remove Duplicate Letters — every character in the input is, by definition, being "deduplicated" to one occurrence in lexicographically smallest order. See that entry for the identical greedy monotonic-stack solution.`,
     code:`# See "Remove Duplicate Letters" above —
# identical greedy monotonic-stack solution (same problem).`,
     complexity:`Time O(n), Space O(1) (bounded alphabet).`}
  ]},
  {name:"Recursive Stack", hint:"Use recursion itself as the call stack to reverse, sort, or peel a stack's structure.", problems:[
    {title:"Reverse a Stack Using Recursion", diff:"Medium",
     statement:`Reverse a stack using only recursion (no auxiliary explicit stack/queue).`,
     approach:`Identical problem and solution to the entry under Recursion > Recursion on LinkedList/Stack. See that entry (pop, recurse, then insert-at-bottom).`,
     code:`# See "Reverse a Stack Using Recursion" under
# Recursion > Recursion on LinkedList/Stack — identical solution.`,
     complexity:`Time O(n^2), Space O(n) (call stack).`},
    {title:"Sort a Stack Using Recursion", diff:"Medium",
     statement:`Sort a stack (ascending, with the smallest on top) using only recursion.`,
     approach:`Pop the top element, recursively sort the rest, then use a helper to insert the popped element back into its correct sorted position by recursively popping larger elements out of the way, inserting, and pushing them back.`,
     code:`def sortStack(stack: list) -> None:
    if not stack:
        return
    top = stack.pop()
    sortStack(stack)
    insert_sorted(stack, top)

def insert_sorted(stack: list, item) -> None:
    if not stack or item > stack[-1]:
        stack.append(item)
        return
    top = stack.pop()
    insert_sorted(stack, item)
    stack.append(top)`,
     complexity:`Time O(n^2), Space O(n) (call stack).`},
    {title:"Remove Outermost Parentheses", diff:"Easy",
     statement:`Given a valid parentheses string that is a concatenation of primitive valid parentheses strings, remove the outermost parentheses of every primitive substring.`,
     approach:`Track nesting depth as you scan. A '(' is "outermost" (and should be dropped) exactly when it opens at depth 0 (before incrementing); a ')' is outermost when it closes back down to depth 0. Every other bracket gets kept.`,
     code:`def removeOuterParentheses(s: str) -> str:
    result = []
    depth = 0
    for ch in s:
        if ch == '(':
            if depth > 0:
                result.append(ch)
            depth += 1
        else:
            depth -= 1
            if depth > 0:
                result.append(ch)
    return "".join(result)`,
     complexity:`Time O(n), Space O(n).`}
  ]}

</script>
<script>
(function(){
  const DATA = window.__DATA__;
  const STORAGE_KEY = "pv_solved_v1";
  const THEME_KEY = "pv_theme_v1";

  function loadSolved(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveSolved(obj){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }catch(e){}
  }
  let solved = loadSolved();

  function loadTheme(){
    try{ return localStorage.getItem(THEME_KEY) || ""; }catch(e){ return ""; }
  }
  function saveTheme(t){
    try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  }
  let theme = loadTheme();
  if(theme) document.documentElement.setAttribute("data-theme", theme);

  document.getElementById("themeToggle").addEventListener("click", function(){
    const cur = document.documentElement.getAttribute("data-theme");
    let next;
    if(!cur){
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      next = prefersDark ? "light" : "dark";
    } else {
      next = cur === "dark" ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", next);
    saveTheme(next);
  });

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function problemKey(topic, sub, title){
    return topic + "::" + sub + "::" + title;
  }

  let activeDiff = "all";
  let searchTerm = "";
  let currentTopicIdx = 0;

  const navTree = document.getElementById("navTree");
  const mainContent = document.getElementById("mainContent");
  const statSolved = document.getElementById("statSolved");
  const statTotal = document.getElementById("statTotal");

  function totalCount(){
    let t = 0;
    DATA.forEach(topic => topic.subs.forEach(sub => t += sub.problems.length));
    return t;
  }
  function solvedCount(){
    return Object.keys(solved).filter(k => solved[k]).length;
  }
  function updateStats(){
    statSolved.textContent = solvedCount();
    statTotal.textContent = totalCount();
  }

  function matchesFilters(p){
    if(activeDiff !== "all" && p.diff !== activeDiff) return false;
    if(searchTerm){
      const hay = p.title.toLowerCase();
      if(!hay.includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  }

  function renderNav(){
    navTree.innerHTML = "";
    DATA.forEach((topic, ti) => {
      let topicCount = 0;
      topic.subs.forEach(sub => sub.problems.forEach(p => { if(matchesFilters(p)) topicCount++; }));

      const topicDiv = document.createElement("div");
      topicDiv.className = "nav-topic";

      const head = document.createElement("div");
      head.className = "nav-topic-head";
      head.innerHTML = "<span>" + escapeHtml(topic.topic) + "</span><span class='cnt'>" + topicCount + "</span>";
      head.addEventListener("click", () => {
        currentTopicIdx = ti;
        renderMain();
        const subs = topicDiv.querySelector(".nav-subs");
        subs.classList.toggle("open");
      });
      topicDiv.appendChild(head);

      const subsDiv = document.createElement("div");
      subsDiv.className = "nav-subs" + (ti === currentTopicIdx ? " open" : "");
      topic.subs.forEach(sub => {
        const subCount = sub.problems.filter(matchesFilters).length;
        const subEl = document.createElement("div");
        subEl.className = "nav-sub";
        subEl.innerHTML = "<span>" + escapeHtml(sub.name) + "</span><span class='cnt'>" + subCount + "</span>";
        subEl.addEventListener("click", (e) => {
          e.stopPropagation();
          currentTopicIdx = ti;
          renderMain();
          setTimeout(() => {
            const target = document.getElementById("sub-" + ti + "-" + topic.subs.indexOf(sub));
            if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
          }, 30);
        });
        subsDiv.appendChild(subEl);
      });
      topicDiv.appendChild(subsDiv);
      navTree.appendChild(topicDiv);
    });
  }

  function renderCode(code){
    return escapeHtml(code);
  }

  function makeProblemCard(topic, sub, p, ti, si, pi){
    const key = problemKey(topic.topic, sub.name, p.title);
    const isDone = !!solved[key];

    const card = document.createElement("div");
    card.className = "problem-card";
    card.id = "prob-" + ti + "-" + si + "-" + pi;

    const head = document.createElement("div");
    head.className = "problem-head";

    const chk = document.createElement("div");
    chk.className = "chk" + (isDone ? " done" : "");
    chk.textContent = isDone ? "✓" : "";
    chk.addEventListener("click", (e) => {
      e.stopPropagation();
      solved[key] = !solved[key];
      saveSolved(solved);
      updateStats();
      chk.classList.toggle("done");
      chk.textContent = solved[key] ? "✓" : "";
      titleSpan.classList.toggle("done-text", !!solved[key]);
    });

    const titleSpan = document.createElement("div");
    titleSpan.className = "p-title" + (isDone ? " done-text" : "");
    titleSpan.textContent = p.title;

    const badge = document.createElement("div");
    badge.className = "diff-badge diff-" + p.diff;
    badge.textContent = p.diff;

    const chev = document.createElement("div");
    chev.className = "chevron";
    chev.textContent = "▸";

    head.appendChild(chk);
    head.appendChild(titleSpan);
    head.appendChild(badge);
    head.appendChild(chev);
    head.addEventListener("click", () => {
      card.classList.toggle("open");
    });

    const body = document.createElement("div");
    body.className = "problem-body";
    body.innerHTML =
      "<h4>Problem</h4><p>" + escapeHtml(p.statement) + "</p>" +
      "<h4>Approach</h4><p>" + escapeHtml(p.approach) + "</p>" +
      "<h4>Python Solution</h4>" +
      "<div class='code-wrap'><button class='copy-btn'>Copy</button><pre><code>" + renderCode(p.code) + "</code></pre></div>" +
      "<h4>Complexity</h4><p>" + escapeHtml(p.complexity) + "</p>";

    card.appendChild(head);
    card.appendChild(body);

    setTimeout(() => {
      const copyBtn = body.querySelector(".copy-btn");
      if(copyBtn){
        copyBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          navigator.clipboard && navigator.clipboard.writeText(p.code).then(() => {
            copyBtn.textContent = "Copied!";
            setTimeout(() => { copyBtn.textContent = "Copy"; }, 1200);
          }).catch(() => {});
        });
      }
    }, 0);

    return card;
  }

  function renderMain(){
    mainContent.innerHTML = "";
    const topic = DATA[currentTopicIdx];
    if(!topic) return;

    const header = document.createElement("div");
    header.className = "topic-header";
    header.innerHTML = "<h1>" + escapeHtml(topic.topic) + "</h1><div class='desc'>" + escapeHtml(topic.desc) + "</div>";
    mainContent.appendChild(header);

    let anyVisible = false;

    topic.subs.forEach((sub, si) => {
      const visibleProblems = sub.problems.filter(matchesFilters);
      if(visibleProblems.length === 0) return;
      anyVisible = true;

      const block = document.createElement("div");
      block.className = "sub-block";
      block.id = "sub-" + currentTopicIdx + "-" + si;

      const h2 = document.createElement("h2");
      h2.textContent = sub.name;
      block.appendChild(h2);

      const hint = document.createElement("p");
      hint.className = "subhint";
      hint.textContent = sub.hint;
      block.appendChild(hint);

      sub.problems.forEach((p, pi) => {
        if(!matchesFilters(p)) return;
        block.appendChild(makeProblemCard(topic, sub, p, currentTopicIdx, si, pi));
      });

      mainContent.appendChild(block);
    });

    if(!anyVisible){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No problems match your search/filter in this topic.";
      mainContent.appendChild(empty);
    }
  }

  document.getElementById("searchBox").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim();
    renderNav();
    renderMain();
  });

  document.querySelectorAll(".filter-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      activeDiff = chip.getAttribute("data-diff");
      renderNav();
      renderMain();
    });
  });

  updateStats();
  renderNav();
  renderMain();
})();

</script>
</body>
</html>
